# Local Supabase config, read by the GitHub integration's deploy pipeline.
# `project_id` is only a LOCAL identifier used to namespace local dev containers —
# it is NOT your remote project ref and is safe to commit.
project_id = "worthit"

# Third-party auth: Clerk integration (native, not the deprecated JWT template method).
# Replace the domain below with the Clerk domain shown in the Clerk Dashboard
# under the Supabase integration setup page.
[auth.third_party.clerk]
enabled = true
domain = "clerk.worthit.eu.cc"

# OTP delivery: this function receives Clerk's `email.created` webhook and sends
# the OTP through Resend. JWT verification must be OFF because Clerk doesn't send
# a Supabase JWT — the function authenticates the request itself by verifying
# Clerk's svix webhook signature.
[functions.clerk-email]
verify_jwt = false
